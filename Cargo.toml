[package]
name = "aterm"
version = "0.0.0"
edition = "2021"
description = "ASHIRT terminal recorder (Rust rewrite)"
license = "MIT"
repository = "https://github.com/ashirt-ops/aterm"
publish = false

[dependencies]
anyhow = "1.0.102"
avt = { version = "0.18.0", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.18"

[features]
# Optional playback support built on the `avt` virtual terminal. Off by default.
playback = ["dep:avt"]
