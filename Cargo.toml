[package]
name = "aterm"
version = "0.0.0"
edition = "2021"
description = "ASHIRT terminal recorder (Rust rewrite)"
license = "MIT"
repository = "https://github.com/ashirt-ops/aterm"
publish = false

[dependencies]
anyhow = "1.0.102"
avt = { version = "0.18.0", optional = true }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
hmac = "0.13.0"
inquire = "0.9.4"
portable-pty = "0.9.0"
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.4"

# SIGWINCH-driven resize detection and raw stdin polling on Unix; see src/recorder/unix.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4.4"

[features]
# Optional playback support built on the `avt` virtual terminal. Off by default.
playback = ["dep:avt"]
