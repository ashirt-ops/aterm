# CI for the aterm Rust crate.
#
# Runs build/test/clippy/fmt across Linux/macOS/Windows on every push and pull
# request, and on every run produces optimized release binaries that are stored
# as downloadable workflow artifacts. On pushes it also publishes GitHub
# Releases: a rolling "continuous" prerelease from `main`, and a versioned
# release for `v*` tags. Publishing uses the GitHub-official `gh` CLI; every
# action here is from the upstream actions/* org.
#
# (This file merges the former ci.yml + release.yml workflows.)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Figure out what kind of run this is. YAML can't do shell interpolation, so
  # we compute these once here and feed them to downstream jobs as outputs.
  run-info:
    name: Gather run info
    runs-on: ubuntu-latest
    outputs:
      isContinuous: ${{ steps.info.outputs.isContinuous }}
      isRelease: ${{ steps.info.outputs.isRelease }}
    steps:
      - name: Calculate run info
        id: info
        shell: bash
        run: |
          CONTINUOUS="false"
          RELEASE="false"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              RELEASE="true"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              CONTINUOUS="true"
          fi
          echo "isContinuous=$CONTINUOUS" >> "$GITHUB_OUTPUT"
          echo "isRelease=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: build / test / lint (${{ matrix.os }})
    needs: run-info
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux
            bin: aterm
          - os: macos-latest
            target_label: macos
            bin: aterm
          - os: windows-latest
            target_label: windows
            bin: aterm.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package artifact
        id: package
        shell: bash
        run: |
          # Stage into a per-OS directory so the resulting archive has a unique
          # name and the inner files don't collide when several archives are
          # attached to a single GitHub Release.
          pkg="aterm-${{ matrix.target_label }}"
          mkdir -p "$pkg"
          cp "target/release/${{ matrix.bin }}" "$pkg/"
          cp LICENSE "$pkg/" 2>/dev/null || true
          cp README.md "$pkg/" 2>/dev/null || true
          if [ "$RUNNER_OS" == "Windows" ]; then
              asset="$pkg.zip"
              7z a "$asset" "$pkg" >/dev/null
          else
              asset="$pkg.tar.gz"
              tar czf "$asset" "$pkg"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aterm-${{ matrix.target_label }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # Publish GitHub Releases. Only runs on pushes (never pull requests): a
  # rolling prerelease for main, and a versioned release for v* tags.
  release:
    name: Release
    needs: [run-info, build]
    if: >-
      github.event_name == 'push' &&
      (needs.run-info.outputs.isContinuous == 'true' || needs.run-info.outputs.isRelease == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Deploy continuous build
        if: needs.run-info.outputs.isContinuous == 'true'
        shell: bash
        run: |
          # Roll the "continuous" release/tag forward to the current commit.
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous artifacts/aterm-*/* \
            --title "Continuous Build" \
            --notes "Rolling build from the latest commit on main (${GITHUB_SHA:0:8})." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Deploy tagged release
        if: needs.run-info.outputs.isRelease == 'true'
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/aterm-*/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
